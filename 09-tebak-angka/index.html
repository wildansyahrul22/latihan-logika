    <h1>Tugas 9: Tebak Angka</h1>
    <p class="deskripsi">Komputer memilih angka rahasia 1–100. Tebak angkanya dalam 7 kesempatan.</p>

    <div class="kartu">
      <form id="form-tebak" novalidate>
        <div class="isian">
          <label for="tebakan">Tebakanmu</label>
          <input type="number" id="tebakan" step="1" min="1" max="100" placeholder="1–100">
        </div>
        <button type="submit" id="tombol-tebak">Tebak</button>
        <button type="button" id="tombol-main-lagi" hidden>Main Lagi</button>
      </form>

      <p id="respons" class="respons" role="status"></p>

      <p>Sisa kesempatan: <strong id="sisa"></strong></p>

      <h2>Riwayat tebakan</h2>
      <ol id="riwayat" class="riwayat"></ol>
    </div>
