<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tugas 3: Jumlah Hari dalam Sebulan | Latihan Logika</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/style.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <p class="kembali"><a href="../index.html">Kembali ke daftar tugas</a></p>

    <h1>Tugas 3: Jumlah Hari dalam Sebulan</h1>
    <p class="deskripsi">Hitung jumlah hari dalam satu bulan. Februari punya 29 hari pada tahun kabisat dan 28 hari pada tahun biasa.</p>

    <div class="kartu">
      <form id="form-hari" novalidate>
        <div class="isian">
          <label for="bulan">Bulan</label>
          <select id="bulan">
            <option value="1">Januari</option>
            <option value="2">Februari</option>
            <option value="3">Maret</option>
            <option value="4">April</option>
            <option value="5">Mei</option>
            <option value="6">Juni</option>
            <option value="7">Juli</option>
            <option value="8">Agustus</option>
            <option value="9">September</option>
            <option value="10">Oktober</option>
            <option value="11">November</option>
            <option value="12">Desember</option>
          </select>
        </div>
        <div class="isian">
          <label for="tahun">Tahun</label>
          <input type="number" id="tahun" step="1" min="1" max="9999" placeholder="contoh: 2024">
        </div>
        <button type="submit">Hitung</button>
      </form>

      <p id="pesan" class="pesan" role="alert" hidden></p>

      <div id="hasil" class="hasil" aria-live="polite" hidden>
        <p id="kalimat-hari" class="kalimat-utama"></p>
        <p id="kalimat-kabisat" class="kalimat-kedua"></p>
      </div>
    </div>

    <nav class="navigasi">
      <a href="../02-nilai-rapor/index.html">Sebelumnya: Nilai Rapor</a>
      <a class="berikutnya" href="../04-tarif-parkir/index.html">Berikutnya: Tarif Parkir</a>
    </nav>
  </main>

  <script src="script.js"></script>
</body>
</html>
